  <div class="container">


    <div class="announcement">
        <span>
            Welcome to Admin Dashboard. Please find the patient list below!!. Click Appointments to view and update Appointments, Click Add Appointment to add new Appointment
        </span>    
    </div>

    <h1 style="text-align: center; color: rgb(26, 26, 151);">Login As Doctor</h1>
    <h5 style="text-align: center; color: blue;">Please enter your Username & Password</h5>

    <div style=" display: flex; justify-content: center; margin: 20px;" class="row">
    

        <div class="col-md-6">
            <div style=" display: flex; align-items: center; width: 500px;   height: 300px;   background-color: rgb(218, 223, 232) ;color: rgb(26, 26, 151);  box-shadow: -20px 10px 30px black; border-radius: 10px; padding-top: 20px;margin-top: 20px;" class="container">
                <form>
                    <ul>
                        <li>                    
                            <label for="formGroupExampleInput" class="form-label"><h4>Username</h4></label>
                            <input type="text" name="username" [(ngModel)]="username" class="form-control" id="formGroupExampleInput" placeholder="User name" required style="width: 400px;">
                        </li>
                        <br>
                        <li>                                          
                            <label for="formGroupExampleInput2" class="form-label"><h4>Password</h4></label>
                            <input type="password" name="password" [(ngModel)]="password" class="form-control" id="formGroupExampleInput2" placeholder="Password" required style="width: 400px;">
                        </li>                   
                    <br>
                    <div class="button" style="display: flex; justify-content: space-between;"> 
                        <button (click)=checkLogin() style="margin: 5px;"  class="btn btn-success" type="button" >Login</button>
                        <button style="margin: 5px;" class="btn btn-warning" type="button" routerLink="/home">Cancel</button>
                    </div>
                    </ul>
                </form>
                



            </div>
        </div>
    </div>
</div>
