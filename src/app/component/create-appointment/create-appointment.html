

<nav style="padding:10px;background-color:rgb(40, 52, 66);display: flex; justify-content: space-between; " class="navbar navbar-expand-lg">
        
    <a style="color: white; font-weight: 700;" class="navbar-brand " routerLink="admin">RAZA HOSPITALS</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
    </button>
    <button class="btn btn-success"  routerLink="/appoint">Back</button>
  </nav>

  <br>
  <div class="container">
    <div class="announcement">
        <span>
            Welcome to Admin Dashboard. Please find the patient list below!!. Click Appointments to view and update Appointments, Click Add Appointment to add new Appointment
        </span>    
    </div>        

    <div class="tableFixHead">

    <h1 style="text-align: center;margin-top: 20px; color: rgb(2, 2, 25);font-weight: 700;">Update Appointment Details</h1>

<div style="display: flex; justify-content: center">

<div style="width: 500px;  border-radius: 50px; display: flex; justify-content: center;  background-color: rgb(40, 52, 66); color: white; box-shadow: -20px 10px 30px black; padding: 20px; margin: 30px;" class="container">

    <form style="padding: 20px; " (ngSubmit)="onSubmit()">

        <div style="width: 350px;" class="form-group">

            <label for="">Patient Name :</label>
            <input type="text" id="name" name="name" class="form-control" placeholder="Enter name" [(ngModel)]="appointment.name">

        </div>
        <br>
        <div style="width: 350px;" class="form-group">

            <label for="">Patient Age :</label>
            <input type="text" id="age" name="age" class="form-control" placeholder="Enter age" [(ngModel)]="appointment.age">

        </div>
        <br>
        <div style="width: 350px;" class="form-group">

            <label for="">Symptoms :</label>
            <input type="text" id="symptoms" name="symptoms" class="form-control" placeholder="Enter symptoms" [(ngModel)]="appointment.symptoms">

        </div>  
        <br>      
        <div style="width: 350px;" class="form-group">

            <label for="">Phone Number :</label>
            <input type="text" id="number" name="number" class="form-control" placeholder="Enter number" [(ngModel)]="appointment.number">

        </div>
        <br>
    <div style="display: flex; justify-content: space-between;">    
        <button type="submit" class="btn btn-success">Submit</button>
        <button class="btn btn-danger" routerLink="/appoint">Cancel</button>
    </div>    
    </form>

</div>

</div>
