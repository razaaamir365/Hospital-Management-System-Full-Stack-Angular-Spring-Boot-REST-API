



<nav style="padding:10px;background-color: rgb(40, 52, 66); display: flex; justify-content: space-between; " class="navbar navbar-expand-lg">
        
    <a style="color: white; font-weight: 700;" class="navbar-brand " routerLink="admin">RAZA HOSPITALS</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
    </button>

    <div class="button">
        <button class="btn btn-success" routerLink="/home">Home</button>
        <button class="btn btn-info" style="margin-left: 20px;" routerLink="/docdesh">Back</button>

<br>

  <div class="container">
    <div class="announcement">
        <span>
            Welcome to Admin Dashboard. Please find the patient list below!!. Click Appointments to view and update Appointments, Click Add Appointment to add new Appointment
        </span>    
    </div>        

<div class="tableFixHead">

    <h1 style="text-align: center;margin-top: 20px; color: rgb(2, 2, 25);font-weight: 700;">Update Patient Details</h1>

<div style="display: flex; justify-content: center">
<div style="width: 500px;  border-radius: 50px;  background-color: rgb(40, 52, 66); color: white; box-shadow: -20px 10px 30px black; border-radius: 10px; padding: 20px; margin: 30px;" class="container">

    <form style="padding: 20px;" (ngSubmit)="onSubmit()">

        <div style="width: 350px;" class="form-group">

            <label for="">Patient Name :</label>
            <input type="text" id="name" name="name" class="form-control" placeholder="Enter name" [(ngModel)]="patientlist().name">

        </div>
        <br>
        <div style="width: 350px;" class="form-group">

            <label for="">Patient Age :</label>
            <input type="text" id="age" name="age" class="form-control" placeholder="Enter age" [(ngModel)]="patientlist().age">

        </div>
        <br>
        <div style="width: 350px;" class="form-group">

            <label for="">Blood Group :</label>
            <input type="text" id="blood" name="blood" class="form-control" placeholder="Enter blood group" [(ngModel)]="patientlist().blood">

        </div>  
        <br>      
        <div style="width: 350px;" class="form-group">

            <label for="">Doctor Fees :</label>
            <input type="text" id="fees" name="fees" class="form-control" placeholder="Enter fees" [(ngModel)]="patientlist().fees">

        </div>
        <br>        
        <div style="width: 350px;" class="form-group">

            <label for="">Prescription :</label>
            <input type="text" id="prescription" name="prescription" class="form-control" placeholder="Enter prescription" [(ngModel)]="patientlist().prescription">

        </div>
        <br>        
        <div style="width: 350px;" class="form-group">

            <label for="">Dose :</label>
            <input type="text" id="dose" name="dose" class="form-control" placeholder="Enter dose" [(ngModel)]="patientlist().dose">

        </div>
        <br>        
        <div style="width: 350px;" class="form-group">

            <label for="">City Name :</label>
            <input type="text" id="city" name="city" class="form-control" placeholder="Enter city" [(ngModel)]="patientlist().city">

        </div>
        <br>
        <div style="width: 350px;" class="form-group">

            <label for="">Uegency :</label>
            <input type="text" id="urgency" name="urgency" class="form-control" placeholder="Enter urgency" [(ngModel)]="patientlist().urgency">

        </div>  
        <br> 
        <div style="display: flex; justify-content: space-between;">    
        <button type="submit" class="btn btn-success">Submit</button>
        <button class="btn btn-success" routerLink="/admin">Back</button>
        </div>    
    </form>

</div>
</div>
