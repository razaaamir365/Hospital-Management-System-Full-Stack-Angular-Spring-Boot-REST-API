    <h2 style="text-align: center;margin-top: 20px; color: rgb(12, 12, 82);font-weight: 700;">Add new Patient</h2>
    <br>
    <div class="announcement">
        <span>
            Welcome to Admin Dashboard. Please find the patient list below!!. Click Appointments to view and update Appointments, Click Add Appointment to add new Appointment
        </span>    
    </div>        
  <hr>
  <!-- <hr>
  <input type="text" name="search" [(ngModel)]="searchText" placeholder="Search" (input)="searchPatients()"> 
  <br> -->
<div class="tableFixHead">
  <br>

<div style="width: 500px;  border-radius: 30px; background-color: rgb(87, 77, 77); color: white; box-shadow: 0 4px 15px blueviolet; padding: 20px; margin: 30px;" class="container">

    <form style="padding: 20px;" (ngSubmit)="onSubmit()">

        <div style="width: 350px;" class="form-group">

            <label for="">Patient Name :</label>
            <input type="text" id="name" name="name" class="form-control" placeholder="Enter name" [(ngModel)]="patients.name">

        </div>
        <br>
        <div style="width: 350px;" class="form-group">

            <label for="">Patient Age :</label>
            <input type="text" id="age" name="age" class="form-control" placeholder="Enter age" [(ngModel)]="patients.age">

        </div>
        <br>
        <div style="width: 350px;" class="form-group">

            <label for="">Blood Group :</label>
            <input type="text" id="blood" name="blood" class="form-control" placeholder="Enter blood group" [(ngModel)]="patients.blood">

        </div>  
        <br>      
        <div style="width: 350px;" class="form-group">

            <label for="">Doctor Fees :</label>
            <input type="text" id="fees" name="fees" class="form-control" placeholder="Enter fees" [(ngModel)]="patients.fees">

        </div>
        <br>        
        <div style="width: 350px;" class="form-group">

            <label for="">Prescription :</label>
            <input type="text" id="prescription" name="prescription" class="form-control" placeholder="Enter prescription" [(ngModel)]="patients.prescription">

        </div>
        <br>        
        <div style="width: 350px;" class="form-group">

            <label for="">Dose :</label>
            <input type="text" id="dose" name="dose" class="form-control" placeholder="Enter dose" [(ngModel)]="patients.dose">

        </div>
        <br>        
        <div style="width: 350px;" class="form-group">

            <label for="">City Name :</label>
            <input type="text" id="city" name="city" class="form-control" placeholder="Enter city" [(ngModel)]="patients.city">

        </div>
        <br>
        <div style="width: 350px;" class="form-group">

            <label for="">Uegency :</label>
            <input type="text" id="urgency" name="urgency" class="form-control" placeholder="Enter urgency" [(ngModel)]="patients.urgency">

        </div>  
        <br> 
    <div style="display: flex; justify-content: space-between;">    
        <button type="submit" class="btn btn-success">Submit</button>
        <div style="display: flex; justify-content: end;">
            <div style="width: 60px; text-align: center; border-radius: 7px; background-color: red;">
                <a style="color: white; padding: 2px;"class="nav-link active " aria-current="page" routerLink="/admin">Cancel</a>
            </div>
        </div>
    </div>    
    </form>

</div>
