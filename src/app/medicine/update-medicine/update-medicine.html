<div class="container"> 

    <div class="announcement">
        <span>

    <h2 style="text-align: center;margin-top: 20px;  font-weight: 700; font-size: 40px;">Update Data</h2>

    <div class="tableFixHead">
<br>

<div style="display: flex; width: 500px;   height: 300px;   background-color: rgb(40, 52, 66) ;color: white;flex-direction: row;  box-shadow: -20px 10px 30px black; border-radius: 10px; margin-bottom: 20px;" class="container">


    <form style="padding: 20px;" (ngSubmit)="onSubmit()">

        <div style="width: 350px;" class="form-group">

            <label for="">Drug Name :</label>
            <input type="text" id="drugName" name="drugName" class="form-control" placeholder="Enter drugName" [(ngModel)]="medicine().drugName">

        </div>
        <br>
        <div style="width: 350px;" class="form-group">

            <label for="">Stock :</label>
            <input type="text" id="stock" name="stock" class="form-control" placeholder="Enter stock" [(ngModel)]="medicine().stock">

        </div>

        <br> 
        <div style="display: flex; justify-content: space-between;">    
        <button type="submit" class="btn btn-success">Submit</button>
        <button class="btn btn-success" routerLink="/view-medicine">Back</button>
        </div>    
    </form>


</div>
